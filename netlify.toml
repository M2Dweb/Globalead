[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Netlify Image CDN — autoriza otimizar as imagens do R2 (converte para WebP/AVIF
# e serve com cache a partir da CDN da Netlify, aliviando o r2.dev)
[images]
  remote_images = ["https://pub-5f573f26090442adbdeb6739a1e97fa9.r2.dev/.*"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[edge_functions]]
  function = "og-blog"
  path = "/blog/*"

[[edge_functions]]
  function = "og-blog"
  path = "/en/blog/*"

# OG tags por página para crawlers sociais (WhatsApp, Facebook, LinkedIn, etc.)
[[edge_functions]]
  function = "og-pages"
  path = "/"

[[edge_functions]]
  function = "og-pages"
  path = "/sobre"

[[edge_functions]]
  function = "og-pages"
  path = "/imoveis"

[[edge_functions]]
  function = "og-pages"
  path = "/imoveis/*"

[[edge_functions]]
  function = "og-pages"
  path = "/seguros"

[[edge_functions]]
  function = "og-pages"
  path = "/credito"

[[edge_functions]]
  function = "og-pages"
  path = "/certificacao"

[[edge_functions]]
  function = "og-pages"
  path = "/carlos-goncalves"

[[edge_functions]]
  function = "og-pages"
  path = "/contactos"

# Mesmas rotas na versão inglesa, para as partilhas de /en também terem
# título e descrição corretos no WhatsApp, Facebook e LinkedIn.
[[edge_functions]]
  function = "og-pages"
  path = "/en"

[[edge_functions]]
  function = "og-pages"
  path = "/en/sobre"

[[edge_functions]]
  function = "og-pages"
  path = "/en/imoveis"

[[edge_functions]]
  function = "og-pages"
  path = "/en/imoveis/*"

[[edge_functions]]
  function = "og-pages"
  path = "/en/seguros"

[[edge_functions]]
  function = "og-pages"
  path = "/en/credito"

[[edge_functions]]
  function = "og-pages"
  path = "/en/certificacao"

[[edge_functions]]
  function = "og-pages"
  path = "/en/carlos-goncalves"

[[edge_functions]]
  function = "og-pages"
  path = "/en/contactos"

# PREVINE O CACHE DO HTML (obrigando o browser a pedir sempre a versão mais recente)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# CACHE ETERNO PARA OS ASSETS (imagens, JS e CSS com hash do Vite)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
