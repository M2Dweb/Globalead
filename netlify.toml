[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[edge_functions]]
  function = "og-blog"
  path = "/blog/*"

# OG tags por página para crawlers sociais (WhatsApp, Facebook, LinkedIn, etc.)
[[edge_functions]]
  function = "og-pages"
  path = "/"

[[edge_functions]]
  function = "og-pages"
  path = "/sobre"

[[edge_functions]]
  function = "og-pages"
  path = "/imoveis"

[[edge_functions]]
  function = "og-pages"
  path = "/imoveis/*"

[[edge_functions]]
  function = "og-pages"
  path = "/seguros"

[[edge_functions]]
  function = "og-pages"
  path = "/credito"

[[edge_functions]]
  function = "og-pages"
  path = "/certificacao"

[[edge_functions]]
  function = "og-pages"
  path = "/carlos-goncalves"

[[edge_functions]]
  function = "og-pages"
  path = "/contactos"

# PREVINE O CACHE DO HTML (obrigando o browser a pedir sempre a versão mais recente)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# CACHE ETERNO PARA OS ASSETS (imagens, JS e CSS com hash do Vite)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
